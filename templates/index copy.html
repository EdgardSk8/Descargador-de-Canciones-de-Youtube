<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descarga tu música favorita de YouTube de forma rápida y segura">
     <link rel="icon" type="image/png" href="/downloader.png">

    <title>YouTube Music Downloader</title>

    <style>
        /* --- Reset y estilos generales --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            color: #1a1a1a;
            min-height: 100vh;
        }

        .Contenedor-General {
            max-width: 1000px;
            margin: auto;
            padding: 1rem;
        }

        /* --- Cabecera --- */
        .Cabecera {
            text-align: center;
            margin-bottom: 1rem;
        }

        .Titulo {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            font-weight: bold;
            color: #1c3c70;
        }

        .Sub-Titulo {
            font-size: 0.9rem;
            color: #555;
            font-weight: 400;
        }

        /* --- Sección de descarga --- */
        .Seccion-Descarga {
            background: #fff;
            border-radius: 12px;
            padding: 0.5rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
            text-align: center;
        }

        .Seccion-Titulo {
            font-size: 1.5rem;
            margin-bottom: 0.7rem;
            color: #1c3c70;
        }

        /* --- Campo de enlace --- */
        .Seccion-Links {
            margin-bottom: 0.5rem;
            text-align: left;
        }

        .Label-Text {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .Input-Boton {
            position: relative;
        }

        .url-input {
            width: 100%;
            padding: 0.7rem 3rem 0.7rem 1rem;
            font-size: 0.85rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: #f9f9f9;
            transition: all 0.2s;
        }

        .url-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        /* --- Botones --- */
        .Btn-Pegar,
        .Btn-Buscar-Cancion {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .Btn-Pegar {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            background: #526bf898;
            color: #000;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .Btn-Pegar:hover {
            background: #1660a0;
        }

        .Btn-Buscar-Cancion {
            padding: 0.7rem 1rem;
            font-size: 0.8rem;
            background: #f59e0b;
            color: #fff;
            font-weight: 600;
            text-transform: uppercase;
        }

        .Btn-Buscar-Cancion:hover {
            background: #d97706;
        }

        /* --- Vista previa de canción --- */
        #Informacion-Cancion {
            max-width: 100%;
            margin-top: 0.5rem;
            border-radius: 8px;
            color: #1a1a1a;
            display: none;
        }

        .Titulo-Cancion {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #1c3c70;
        }

        .preview-info {
            text-align: center;
            margin-bottom: 1rem;
            color: #555;
            font-size: 0.95rem;
        }

        .Imagen-Caratula {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 0.5rem auto;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* --- Carga --- */
        .loading {
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #ccc;
            border-top: 4px solid #4caf50;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.3s linear infinite;
            margin: 0 auto 5px;
            padding: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- Renombrar y descargar --- */
        .Contenedor-Renombrar {
            margin-top: 10px;
        }

        .Contenedor-Renombrar label {
            font-size: 0.8rem;
            color: #555;
        }

        .Contenedor-Renombrar input {
            width: 100%;
            padding: 0.5rem;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            background: #f9f9f9;
            color: #1a1a1a;
            transition: all 0.2s;
        }

        .Contenedor-Renombrar input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .Btn-Descargar-Cancion {
            margin-top: 10px;
            padding: 0.7rem 1.5rem;
            background: #f59e0b;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .Btn-Descargar-Cancion:hover {
            background: #d97706;
        }

        /* --- Barra de progreso --- */
        #progreso-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 8px;
            padding: 3px;
            margin-top: 10px;
        }

        #barra-progreso {
            width: 0%;
            height: 16px;
            background-color: #1c7027;
            border-radius: 6px;
            transition: width 0.2s ease;
        }

        .informacion-progreso {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #555;
            text-align: center;
        }

        /* --- Pie de página --- */
        .Seccion-Footer {
            text-align: center;
            color: #777;
        }

        /* --- Ajustes para pantallas pequeñas --- */
        @media (max-width: 768px) {
            .Titulo {
                font-size: 1rem;
            }

            .Sub-Titulo {
                font-size: 0.8rem;
            }

            .Seccion-Titulo {
                font-size: 1rem;
            }

            .Label-Text {
                font-size: 0.8rem;
            }

            .url-input {
                padding: 0.5rem;
                font-size: 0.75rem;
            }

            .Btn-Pegar {
                padding: 3px 6px;
                font-size: 0.6rem;
            }

            .Btn-Buscar-Cancion {
                padding: 0.5rem 0.8rem;
                font-size: 0.6rem;
            }

            .Seccion-Footer {
                font-size: 0.7rem;
            }

            .Titulo-Cancion {
                font-size: 0.9rem;
                margin-bottom: 0.5rem;
            }

            .Informacion-Cancion-p {
                margin-bottom: 0.5rem;
                font-size: 0.75rem;
            }

            .spinner {
                width: 24px;
                height: 24px;
                padding: 0.5rem;
            }

            .loading p {
                font-size: 0.75rem;
            }

            .Imagen-Caratula {
                width: 90%;
            }

            .Btn-Descargar-Cancion {
                font-size: 0.7rem;
                padding: 0.3rem 0.7rem;
            }

            #barra-progreso {
                height: 14px;
            }

            .informacion-progreso {
                font-size: 0.7rem;
            }
        }
    </style>

</head>

<body>

    <div class="Contenedor-General"> <!-- Contenedor que cubre toda la web -->

        <!-- Seccion de Cabecera -->
        <header class="Cabecera">
            <h1 class="Titulo">YouTube Music Downloader</h1>
            <p class="Sub-Titulo">Descarga tu música favorita de YouTube de forma rápida y sencilla</p>
        </header>

        <!-- Seccion de Descarga de canciones mas carga dinamica de JS -->
        <section class="Seccion-Descarga">

            <h2 class="Seccion-Titulo">Descargar Música</h2>
             
            <div class="Seccion-Links"> <!-- Seccion del input y boton "pegar" -->
                <label class="Label-Text">Pega aquí el enlace de YouTube:</label>

                <div class="Input-Boton">
                    <input 
                        type="url" 
                        id="youtube-url" 
                        class="url-input" 
                        placeholder="https://www.youtube.com/watch?v=..." 
                        required
                        pattern="https?://(www\.)?youtube\.com/watch\?v=.*"
                    >
                    <button type="button" class="Btn-Pegar">Pegar📋</button>
                </div>
            </div>

            <!-- Btn para buscar cancion -->
            <button class="Btn-Buscar-Cancion" data-action="audio-video">Buscar Canción 🎵</button> 
            
            <div id="Informacion-Cancion"></div> <!-- Div que muestra la carga dinamica de JS (Caratula, Duracion) -->

            <div class="loading" style="display:none;"> <!-- Div que carga el "Spinner" de carga -->

                <div class="spinner"></div> <!-- Clase Spinner -->
                <p>Cargando información</p>

            </div>

            <div id="Contenedor-Barra-Progreso" style="display:none;"> <!-- Contenedor de Barra de progreso -->

                <div id="progreso-container"> <!-- Contenedor de la barra (Blanco por defecto) -->
                    <div id="barra-progreso"></div> <!-- Barra (Verde o Azul) -->
                </div>
                <p class="informacion-progreso"></p> <!-- Informacion sobre el estado de la descarga en % -->

            </div>

        </section>

        <!-- Footer Section -->
        <footer class="Seccion-Footer">
            <p>&copy; 2025 YouTube Music Downloader. Todos los derechos reservados.</p>
            <p>Respeta los derechos de autor y las políticas de YouTube.</p>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
